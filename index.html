<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <link rel="stylesheet" href="./src/css/styleDesktop.css">
    <link rel="stylesheet" href="./src/css/styleMobile.css">
</head>
<body>
    <main>
        <div class="logoContainer">
            <img src="./src/media/logo.svg">
            <p1 class="titLogo">Nexora</p1>
        </div>

        <div class="cabecalhoContainer">
            <p class="txtCabecalho cabeca1">Olá, bem-vindo de volta!</p>
            <p class="txtCabecalho cabeca2">faça login para continuar</p>
        </div>

        <form class="formulario">

            <input type="text" name="login" id="iLogin" class="login inputs" autocomplete="off" placeholder="Login">
            <input type="password" name="senha" id="iSenha" class="senha inputs" autocomplete="off" placeholder="Senha">

            <p class="txtEsqueceu">Esqueceu a senha?</p>

            <button type="submit" class="btnEntrar">Entrar</button>

        </form>

        <div class="separadorContainer">
            <div class="linha linha1"></div>
            <p>ou</p>
            <div class="linha linha2"></div>
        </div>

        <button type="submit" class="btnGoogle">
            <img src="./src/media/google.svg">
            <span>Entrar com o Google</span>
        </button>

        <a href="./pgcriarConta.html" rel="norefferer next" target="_self">
            <p class="txtNaoResgistrado">Não é registrado? <span>Criar uma conta</span></p>
        </a>

    </main>
</body>
</html>
